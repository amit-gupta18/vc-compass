services:
  mongo:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-vc-brain-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URL: mongodb://mongo:27017/vc_brain?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vc-brain-password}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
    depends_on:
      - mongo
      - redis
      - neo4j
    ports:
      - "4000:4000"

  workers:
    build:
      context: ..
      dockerfile: infra/docker/workers.Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URL: mongodb://mongo:27017/vc_brain?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vc-brain-password}
    depends_on:
      - mongo
      - redis
      - neo4j

  scheduler:
    build:
      context: ..
      dockerfile: infra/docker/workers.Dockerfile
    command: ["pnpm", "--filter", "@vc-brain/scheduler", "start"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  redis_data:
  neo4j_data:
